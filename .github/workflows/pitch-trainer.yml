name: PitchTrainer (Windows bundle)

on:
  push:
    paths:
      - "pitch-trainer/**"
      - ".github/workflows/pitch-trainer.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pitch-trainer
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq msitools
      - run: python3 pitch-trainer/build/build_bundle.py dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: PitchTrainer-windows
          path: dist/PitchTrainer-windows.zip
          retention-days: 14

  test-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PitchTrainer-windows
      - name: Unzip into an Arabic path
        shell: pwsh
        run: |
          $root = "C:\تجربة صوت"
          New-Item -ItemType Directory -Force $root | Out-Null
          Expand-Archive PitchTrainer-windows.zip -DestinationPath $root
          Get-ChildItem "$root\PitchTrainer"
      - name: Python, tkinter, numpy, sounddevice (PortAudio), ffmpeg
        shell: pwsh
        run: |
          $py = "C:\تجربة صوت\PitchTrainer\python\python.exe"
          & $py -c "import sys, tkinter, numpy, sounddevice as sd; print(sys.version); print('numpy', numpy.__version__, 'sounddevice', sd.__version__, sd.get_portaudio_version()[1]); print('host APIs:', [a['name'] for a in sd.query_hostapis()]); print('devices on this runner:', len(sd.query_devices()))"
          if ($LASTEXITCODE) { exit 1 }
          & "C:\تجربة صوت\PitchTrainer\ffmpeg\ffmpeg.exe" -hide_banner -version | Select-Object -First 1
          if ($LASTEXITCODE) { exit 1 }
      - name: Self-test — detection, every mode, scoring accuracy vs truth, calibration, song extraction (MP3), report
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          $py = "C:\تجربة صوت\PitchTrainer\python\python.exe"
          & $py "C:\تجربة صوت\PitchTrainer\app\selftest.py" "C:\تجربة صوت\عينة"
          if ($LASTEXITCODE) { exit 1 }
      - name: START.bat — the window runs every new mode sung by a synthetic singer (screenshots per mode)
        shell: pwsh
        run: |
          $dir = "C:\تجربة صوت\PitchTrainer"
          $out = "C:\تجربة صوت\عينة\gui-result.json"
          $shots = "C:\تجربة صوت\لقطات"
          New-Item -ItemType Directory -Force $shots | Out-Null
          $env:PITCHTRAINER_REPORT_DIR = "C:\تجربة صوت\التقارير - Reports"
          $argline = "/c `"`"$dir\START.bat`" --autotest `"$out`" `"$shots`"`""
          Start-Process -FilePath "cmd.exe" -ArgumentList $argline -WorkingDirectory $dir
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($p) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save($p)
          }
          $sw = [Diagnostics.Stopwatch]::StartNew()
          while (-not (Test-Path $out) -and $sw.Elapsed.TotalSeconds -lt 900) {
            Get-ChildItem $shots -Filter *.req -ErrorAction SilentlyContinue | ForEach-Object {
              Shot (Join-Path $shots ($_.BaseName + ".png")); Remove-Item $_.FullName }
            if (Test-Path "$dir\error.log") { break }
            Start-Sleep -Milliseconds 250
          }
          Start-Sleep -Seconds 2
          Get-ChildItem $shots -Filter *.req -ErrorAction SilentlyContinue | ForEach-Object { Shot (Join-Path $shots ($_.BaseName + ".png")); Remove-Item $_.FullName }
          Stop-Process -Name pythonw -Force -ErrorAction SilentlyContinue
          if (Test-Path "$dir\error.log") { Get-Content "$dir\error.log" -Encoding utf8; exit 1 }
          if (-not (Test-Path $out)) { Write-Error "GUI produced no result"; exit 1 }
          $r = Get-Content $out -Encoding utf8 -Raw | ConvertFrom-Json
          $r.sessions | Select-Object mode, notes, exact_pct, close_pct, note_avg_cents, lat_ms, ref_plays, steps, truth_n, truth_mae, truth_max, max_target | Format-Table -AutoSize | Out-String -Width 200
          $r.calib | ConvertTo-Json
          $fail = @()
          if ([math]::Abs($r.calib.lat - 0.135) -gt 0.02) { $fail += "calibration $($r.calib.lat)" }
          $modes = ($r.sessions | ForEach-Object { $_.mode }) -join ","
          if ($modes -ne "drone,callresp,song,onset,stability,leaps,ajnas") { $fail += "modes $modes" }
          foreach ($s in $r.sessions) {
            if ($s.max_target -gt 67.0001) { $fail += "$($s.mode): target above G4" }
            if ($s.notes -lt 2) { $fail += "$($s.mode): no notes scored" }
            if ($s.truth_n -gt 0 -and $s.truth_mae -gt 2) { $fail += "$($s.mode): scoring off by $($s.truth_mae)c" }
            if (@("callresp","onset","stability","leaps","ajnas") -contains $s.mode -and $s.ref_plays -ne $s.steps) { $fail += "$($s.mode): reference not played" }
            if ($s.mode -eq "song" -and $s.ref_plays -ne 1) { $fail += "song not played" }
          }
          $st = $r.sessions | Where-Object { $_.mode -eq "stability" }
          if ([math]::Abs($st.stab.vib_rate - 5.5) -gt 0.4 -or $st.stab.end_drop_c -gt -18) { $fail += "stability analysis" }
          $lp = $r.sessions | Where-Object { $_.mode -eq "leaps" }
          if ($lp.leaps.ok_pct -lt 100) { $fail += "leaps" }
          $aj = $r.sessions | Where-Object { $_.mode -eq "ajnas" }
          if (-not $aj.blind) { $fail += "blind flag" }
          $dr = $r.sessions | Where-Object { $_.mode -eq "drone" }
          if (-not (Test-Path $dr.wav)) { $fail += "WAV recording missing" }
          if (-not (Test-Path $r.report)) { $fail += "report missing" }
          if ($fail.Count) { $fail | ForEach-Object { Write-Error $_ }; exit 1 }
          Get-Content $r.report -Encoding utf8
          Get-ChildItem $shots
      - name: Collect results
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force results | Out-Null
          Copy-Item "C:\تجربة صوت\لقطات\*.png", "C:\تجربة صوت\عينة\gui-result.json", "C:\تجربة صوت\التقارير - Reports\*.md" results -ErrorAction SilentlyContinue
          Compress-Archive -Path results\* -DestinationPath selftest-results.zip -Force
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-results
          path: selftest-results.zip

  release:
    needs: [build, test-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=pitch-trainer
          gh release delete "$tag" -y --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create "$tag" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "PitchTrainer (Windows)" --prerelease \
            --notes "حمّل PitchTrainer-windows.zip، فكّه، ودوس START.bat. التفاصيل في README.md جوه الفولدر." \
            PitchTrainer-windows/PitchTrainer-windows.zip selftest-results/selftest-results.zip
