<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Wasem · QR</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0a">
<!-- Personal QR card: Wasem keeps this on his home screen and shows it to people; the code opens /me → home page -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wasem QR">
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; text-align:center;
    padding:max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    background:radial-gradient(70% 45% at 50% 40%, rgba(224,164,88,.2), transparent 70%), #0a0a0a;
    color:#f5efe6; font-family:'Syne', system-ui, sans-serif; -webkit-user-select:none; user-select:none;
  }
  .qr { width:min(82vw, 60vh, 420px); aspect-ratio:1; border-radius:28px; overflow:hidden; box-shadow:0 30px 90px -25px rgba(224,164,88,.55); }
  .qr img { width:100%; height:100%; display:block; }
  h1 { font-weight:800; font-size:clamp(26px, 8vw, 40px); line-height:.95; text-transform:uppercase; }
  .ar { font-family:'Reem Kufi', sans-serif; font-weight:500; font-size:clamp(22px, 6vw, 30px); color:#e0a458; margin-top:-8px; }
  .hint { font-family:'Reem Kufi', sans-serif; font-size:16px; color:rgba(245,239,230,.6); }
  .url { font-weight:700; font-size:14px; letter-spacing:.14em; color:#e0a458; }
</style>
</head>
<body>
  <div class="qr"><img src="qr.png" alt="QR code — wasemabdelhady.com"></div>
  <h1>Wasem<br>Abdelhady</h1>
  <p class="ar">وسيم عبد الهادي</p>
  <p class="hint">صوّر الكود بالكاميرا</p>
  <p class="url">WASEMABDELHADY.COM</p>
</body>
</html>
