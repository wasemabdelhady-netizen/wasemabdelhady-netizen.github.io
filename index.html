<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  body {
    font-family:'Cairo',system-ui,sans-serif;
    min-height:100vh;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(224,164,88,.18), transparent 60%),
      radial-gradient(900px 500px at 20% 110%, rgba(56,98,120,.22), transparent 60%),
      linear-gradient(180deg,#0a0a0f 0%,#0d0e13 100%);
    color:#f4efe6;
    display:flex; justify-content:center;
    padding:48px 20px;
  }

  .wrap { width:100%; max-width:440px; text-align:center; }

  .avatar {
    width:118px; height:118px; border-radius:50%;
    margin:0 auto 18px;
    background:linear-gradient(145deg,#2a2118,#1a1c22);
    border:2px solid rgba(224,164,88,.55);
    box-shadow:0 12px 40px rgba(0,0,0,.55), 0 0 0 6px rgba(224,164,88,.06);
    display:flex; align-items:center; justify-content:center;
    font-size:46px; font-weight:800; color:#e0a458;
    overflow:hidden;
  }
  .avatar img { width:100%; height:100%; object-fit:cover; object-position:center 20%; display:block; }

  .name { font-size:30px; font-weight:800; letter-spacing:.5px; }
  .name span { color:#e0a458; }
  .tag { margin-top:6px; font-size:14px; color:#b9b2a6; font-weight:600; }
  .city { margin-top:4px; font-size:12px; color:#7d7466; }

  .section-title {
    margin:30px 0 12px; font-size:12px; font-weight:700;
    letter-spacing:2px; color:#8a8273; text-transform:uppercase;
  }

  a.btn {
    display:flex; align-items:center; gap:14px;
    width:100%; padding:15px 18px; margin:11px 0;
    border-radius:16px; text-decoration:none;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.08);
    color:#f4efe6; font-size:16px; font-weight:600;
    backdrop-filter:blur(6px);
    transition:transform .15s ease, background .2s ease, border-color .2s ease;
  }
  a.btn:hover { transform:translateY(-2px); background:rgba(255,255,255,.08); border-color:rgba(224,164,88,.45); }
  a.btn .ico { width:26px; height:26px; flex:0 0 26px; display:flex; align-items:center; justify-content:center; }
  a.btn .label { flex:1; text-align:right; }
  a.btn .arrow { opacity:.4; font-size:14px; }

  a.feature {
    background:linear-gradient(135deg, rgba(224,164,88,.95), rgba(201,134,60,.95));
    color:#1a1206; border:none; font-weight:800;
    box-shadow:0 10px 30px rgba(224,164,88,.28);
  }
  a.feature .arrow { opacity:.6; }

  .footer { margin-top:34px; font-size:11px; color:#5f594d; letter-spacing:1px; }
</style>
