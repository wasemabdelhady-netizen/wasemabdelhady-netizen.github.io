name: ReleaseKit (Windows bundle)

on:
  push:
    paths:
      - "release-kit/**"
      - ".github/workflows/release-kit.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-kit
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq msitools zstd
      - run: python3 release-kit/build/build_bundle.py dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: ReleaseKit-windows
          path: dist/ReleaseKit-windows.zip
          retention-days: 14

  test-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ReleaseKit-windows
      - name: Unzip into an Arabic path
        shell: pwsh
        run: |
          $root = "C:\تجربة إصدار"
          New-Item -ItemType Directory -Force $root | Out-Null
          Expand-Archive ReleaseKit-windows.zip -DestinationPath $root
          Get-ChildItem "$root\ReleaseKit"
          Get-ChildItem "$root\ReleaseKit\fonts"
      - name: Python, tkinter, numpy, RAQM
        shell: pwsh
        run: |
          $py = "C:\تجربة إصدار\ReleaseKit\python\python.exe"
          & $py -c "import sys, tkinter, numpy; from PIL import features, Image; print(sys.version); print('tk', tkinter.TkVersion, 'numpy', numpy.__version__); print('raqm', features.check('raqm'), features.version('raqm'), 'fribidi', features.version('fribidi'), 'harfbuzz', features.version('harfbuzz')); assert features.check('raqm')"
          if ($LASTEXITCODE) { exit 1 }
      - name: Full kit on sample files (Arabic names, Arabic temp folder)
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          New-Item -ItemType Directory -Force "C:\تجربة إصدار\مؤقت" | Out-Null
          $env:TEMP = "C:\تجربة إصدار\مؤقت"; $env:TMP = $env:TEMP
          $py = "C:\تجربة إصدار\ReleaseKit\python\python.exe"
          & $py "C:\تجربة إصدار\ReleaseKit\app\selftest.py" "C:\تجربة إصدار\عينة"
          if ($LASTEXITCODE) { exit 1 }
      - name: START.bat — the window builds a whole kit
        shell: pwsh
        run: |
          $dir = "C:\تجربة إصدار\ReleaseKit"
          $s = "C:\تجربة إصدار\عينة"
          $out = "$s\gui-result.json"
          $cfg = "$s\gui-test.json"
          $env:TEMP = "C:\تجربة إصدار\مؤقت"; $env:TMP = $env:TEMP
          @{ out = $out; fields = @{ cover = "$s\غلاف تجربة.png"; audio = "$s\ماستر تجربة.wav"; clip = "$s\كليب قصير.mp4";
             ar = "أغنية الشباك"; en = "Window Song"; artist = "وسيم عبد الهادي · Wasem Abdelhady"; out = "$s\من الشباك" } } |
            ConvertTo-Json -Depth 4 | Out-File -Encoding utf8 $cfg
          Get-Content $cfg -Encoding utf8
          $argline = "/c `"`"$dir\START.bat`" --autotest `"$cfg`"`""
          Start-Process -FilePath "cmd.exe" -ArgumentList $argline -WorkingDirectory $dir
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $t = 0
          while (-not (Test-Path $out) -and $t -lt 900) {
            Start-Sleep -Seconds 5; $t += 5
            if ($t -eq 40) {
              $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
              [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
              $bmp.Save("$s\gui.png")
            }
          }
          Start-Sleep -Seconds 2
          Stop-Process -Name pythonw -Force -ErrorAction SilentlyContinue
          if (Test-Path "$dir\error.log") { Get-Content "$dir\error.log" -Encoding utf8; exit 1 }
          if (-not (Test-Path $out)) { Write-Error "GUI produced no result"; exit 1 }
          $r = Get-Content $out -Encoding utf8 -Raw | ConvertFrom-Json
          $r | ConvertTo-Json -Depth 4
          if ($r.error) { exit 1 }
          if ($r.files.Count -ne 9) { Write-Error "expected 9 files"; exit 1 }
          foreach ($f in $r.files) { if (-not (Test-Path -LiteralPath $f)) { Write-Error "missing $f"; exit 1 } }
          if (-not $r.kit.EndsWith("Window Song - Release Kit")) { Write-Error "wrong kit folder"; exit 1 }
          Get-ChildItem -LiteralPath $r.kit
      - name: Collect results
        if: always()
        shell: pwsh
        run: |
          $s = "C:\تجربة إصدار\عينة"
          New-Item -ItemType Directory -Force results\selftest, results\gui | Out-Null
          Copy-Item "$s\*.png", "$s\gui-result.json" results -ErrorAction SilentlyContinue
          Copy-Item "$s\output\*" results\selftest -Recurse -ErrorAction SilentlyContinue
          Copy-Item "$s\من الشباك\*" results\gui -Recurse -ErrorAction SilentlyContinue
          Get-ChildItem results\gui -Recurse -Filter "*Visualizer*" | Remove-Item -ErrorAction SilentlyContinue
          Compress-Archive -Path results\* -DestinationPath selftest-results.zip -Force
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-results
          path: selftest-results.zip

  release:
    needs: [build, test-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=release-kit
          gh release delete "$tag" -y --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create "$tag" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "ReleaseKit (Windows)" --prerelease \
            --notes "حمّل ReleaseKit-windows.zip، فكّه، ودوس START.bat. التفاصيل في README.md جوه الفولدر." \
            ReleaseKit-windows/ReleaseKit-windows.zip selftest-results/selftest-results.zip
