name: HarmonyHelper (Windows bundle)

on:
  push:
    paths:
      - "harmony-helper/**"
      - ".github/workflows/harmony-helper.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harmony-helper
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq msitools
      - run: python3 harmony-helper/build/build_bundle.py dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: HarmonyHelper-windows
          path: dist/HarmonyHelper-windows.zip
          retention-days: 14

  test-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HarmonyHelper-windows
      - name: Unzip into an Arabic path
        shell: pwsh
        run: |
          $root = "C:\تجربة هارموني"
          New-Item -ItemType Directory -Force $root | Out-Null
          Expand-Archive HarmonyHelper-windows.zip -DestinationPath $root
          Get-ChildItem "$root\HarmonyHelper"
      - name: Python, tkinter, numpy, scipy
        shell: pwsh
        run: |
          $py = "C:\تجربة هارموني\HarmonyHelper\python\python.exe"
          & $py -c "import sys, tkinter, winsound, numpy, scipy.signal; print(sys.version); print('tk', tkinter.TkVersion, 'numpy', numpy.__version__, 'scipy', scipy.__version__)"
          if ($LASTEXITCODE) { exit 1 }
      - name: Analysis, MIDI export and preview on a sample song (Arabic names)
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          $py = "C:\تجربة هارموني\HarmonyHelper\python\python.exe"
          & $py "C:\تجربة هارموني\HarmonyHelper\app\selftest.py" "C:\تجربة هارموني\عينة"
          if ($LASTEXITCODE) { exit 1 }
      - name: START.bat — GUI analyzes, previews a harmony line and exports
        shell: pwsh
        run: |
          $dir = "C:\تجربة هارموني\HarmonyHelper"
          $s = "C:\تجربة هارموني\جوه الواجهة"
          New-Item -ItemType Directory -Force $s | Out-Null
          Copy-Item "C:\تجربة هارموني\عينة\أغنية تجربة.wav", "C:\تجربة هارموني\عينة\أغنية تجربة - vocal.wav" $s
          $out = "$s\gui-result.json"
          $argline = "/c `"`"$dir\START.bat`" --autotest `"$out`" `"$s\أغنية تجربة.wav`" `"$s\أغنية تجربة - vocal.wav`"`""
          Start-Process -FilePath "cmd.exe" -ArgumentList $argline -WorkingDirectory $dir
          $t = 0
          while (-not (Test-Path $out) -and $t -lt 180) { Start-Sleep -Seconds 2; $t += 2 }
          Start-Sleep -Seconds 2
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$s\gui.png")
          Stop-Process -Name pythonw -Force -ErrorAction SilentlyContinue
          if (Test-Path "$dir\error.log") { Get-Content "$dir\error.log" -Encoding utf8; exit 1 }
          if (-not (Test-Path $out)) { Write-Error "GUI produced no result"; exit 1 }
          $r = Get-Content $out -Encoding utf8 -Raw | ConvertFrom-Json
          $r | ConvertTo-Json -Depth 4
          if ($r.error) { exit 1 }
          if ($r.bpm -ne 96 -or $r.key -ne "D minor") { Write-Error "wrong BPM/key"; exit 1 }
          if ($r.files.Count -ne 10) { Write-Error "expected 10 files"; exit 1 }
          if ($r.song_vol -ne 30 -or $r.line_vol -ne 50) { Write-Error "volume sliders not set"; exit 1 }
          if ([math]::Abs($r.mix_gains[0] - 0.3) -gt 0.001 -or [math]::Abs($r.mix_gains[1] - 0.5) -gt 0.001) { Write-Error "volume not applied while playing"; exit 1 }
          Write-Host "playback backend: $($r.player)"
          foreach ($f in $r.files) { if (-not (Test-Path $f)) { Write-Error "missing $f"; exit 1 } }
          Get-ChildItem $r.folder
      - name: Collect results
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force results | Out-Null
          Copy-Item "C:\تجربة هارموني\جوه الواجهة\gui.png", "C:\تجربة هارموني\جوه الواجهة\gui-result.json" results -ErrorAction SilentlyContinue
          Copy-Item "C:\تجربة هارموني\جوه الواجهة\أغنية تجربة - HarmonyHelper\*" results -ErrorAction SilentlyContinue
          Compress-Archive -Path results\* -DestinationPath selftest-results.zip -Force
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-results
          path: selftest-results.zip

  release:
    needs: [build, test-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=harmony-helper
          ver=$(grep -oP '^VERSION = "\K[^"]+' harmony-helper/app/engine.py)
          gh release delete "$tag" -y --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create "$tag" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "HarmonyHelper v$ver (Windows)" --prerelease \
            --notes "حمّل HarmonyHelper-windows.zip، فكّه، ودوس START.bat. التفاصيل وإزاي تدخل الـ MIDI الـ DAW في README.md جوه الفولدر." \
            HarmonyHelper-windows/HarmonyHelper-windows.zip selftest-results/selftest-results.zip
