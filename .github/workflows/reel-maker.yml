name: Reel Maker (Windows bundle)

on:
  push:
    paths:
      - "reel-maker/**"
      - ".github/workflows/reel-maker.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq msitools zstd
      - run: python3 reel-maker/build/build_bundle.py dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: ReelMaker-windows
          path: dist/ReelMaker-windows.zip
          retention-days: 14

  test-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ReelMaker-windows
      - name: Unzip into an Arabic path
        shell: pwsh
        run: |
          $root = "C:\تجربة ريلز"
          New-Item -ItemType Directory -Force $root | Out-Null
          Expand-Archive ReelMaker-windows.zip -DestinationPath $root
          Get-ChildItem "$root\ReelMaker"
      - name: Python, tkinter, RAQM
        shell: pwsh
        run: |
          $py = "C:\تجربة ريلز\ReelMaker\python\python.exe"
          & $py -c "import sys, tkinter; from PIL import features, Image; print(sys.version); print('tk', tkinter.TkVersion); print('raqm', features.check('raqm'), features.version('raqm'), 'fribidi', features.version('fribidi'), 'harfbuzz', features.version('harfbuzz')); assert features.check('raqm')"
          if ($LASTEXITCODE) { exit 1 }
      - name: Render sample reels (Arabic file names)
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          $py = "C:\تجربة ريلز\ReelMaker\python\python.exe"
          & $py "C:\تجربة ريلز\ReelMaker\app\selftest.py" "C:\تجربة ريلز\عينة"
          if ($LASTEXITCODE) { exit 1 }
      - name: Auto-mode packages (faster-whisper, CTranslate2, OpenCV, rapidfuzz)
        shell: pwsh
        run: |
          $py = "C:\تجربة ريلز\ReelMaker\python\python.exe"
          & $py -c "import numpy, cv2, rapidfuzz, ctranslate2, faster_whisper; print('numpy', numpy.__version__, 'cv2', cv2.__version__, 'rapidfuzz', rapidfuzz.__version__, 'ct2', ctranslate2.__version__, 'fw', faster_whisper.__version__); assert hasattr(cv2, 'CascadeClassifier')"
          if ($LASTEXITCODE) { exit 1 }
      - name: Auto mode self-test (mock ASR end to end + real faster-whisper tiny)
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          $py = "C:\تجربة ريلز\ReelMaker\python\python.exe"
          & $py "C:\تجربة ريلز\ReelMaker\app\selftest_auto.py" "C:\تجربة ريلز\عينة أوتو" --real-asr tiny
          if ($LASTEXITCODE) { exit 1 }
      - name: Cinematic packages (onnxruntime, tkinterdnd2, YuNet, lut3d/zscale in ffmpeg)
        shell: pwsh
        run: |
          $dir = "C:\تجربة ريلز\ReelMaker"
          & "$dir\python\python.exe" -c "import onnxruntime, cv2, numpy, tkinterdnd2; print('ort', onnxruntime.__version__, 'cv2', cv2.__version__); assert hasattr(cv2, 'FaceDetectorYN')"
          if ($LASTEXITCODE) { exit 1 }
          $f = & "$dir\ffmpeg\ffmpeg.exe" -hide_banner -filters 2>&1 | Out-String
          if ($f -notmatch "lut3d" -or $f -notmatch "zscale") { Write-Error "ffmpeg lacks lut3d/zscale"; exit 1 }
      - name: Cinematic self-test (sync, real ONNX alignment, 4 styles + IG, versioning, Arabic paths)
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          $py = "C:\تجربة ريلز\ReelMaker\python\python.exe"
          & $py "C:\تجربة ريلز\ReelMaker\app\selftest_cine.py" "C:\تجربة ريلز\عينة سينمائي" --quick --align
          if ($LASTEXITCODE) { exit 1 }
      - name: Style packs, fonts and word animations (Arabic shaping, fixed layout, lyric mode)
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          $py = "C:\تجربة ريلز\ReelMaker\python\python.exe"
          & $py "C:\تجربة ريلز\ReelMaker\app\selftest_packs.py" "C:\تجربة ريلز\عينة باكات"
          if ($LASTEXITCODE) { exit 1 }
      - name: START.bat — cinematic tab runs analyse → reels → render
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          $dir = "C:\تجربة ريلز\ReelMaker"
          $g = "C:\تجربة ريلز\واجهة سينمائي"
          & "$dir\python\python.exe" "$dir\app\selftest_cine.py" $g --gui-only
          if ($LASTEXITCODE) { exit 1 }
          $argline = "/c `"`"$dir\START.bat`" --autotest-cine `"$g\gui-autotest.json`"`""
          Start-Process -FilePath "cmd.exe" -ArgumentList $argline -WorkingDirectory $dir
          $t = 0
          while (-not (Test-Path "$g\gui-report.json") -and $t -lt 600) { Start-Sleep -Seconds 3; $t += 3 }
          if (Test-Path "$dir\error.log") { Get-Content "$dir\error.log" }
          if (-not (Test-Path "$g\gui-report.json")) { Write-Error "GUI cinematic run did not finish"; exit 1 }
          $rep = Get-Content "$g\gui-report.json" -Raw -Encoding UTF8 | ConvertFrom-Json
          $rep | ConvertTo-Json
          if (-not $rep.ok) { exit 1 }
          if (-not (Test-Path -LiteralPath $rep.reels[0])) { Write-Error "reel missing"; exit 1 }
      - name: START.bat opens the window
        shell: pwsh
        run: |
          $dir = "C:\تجربة ريلز\ReelMaker"
          Start-Process -FilePath "cmd.exe" -ArgumentList "/c", "`"$dir\START.bat`"" -WorkingDirectory $dir
          Start-Sleep -Seconds 12
          $p = Get-Process pythonw -ErrorAction SilentlyContinue
          if (-not $p) { Get-Content "$dir\error.log" -ErrorAction SilentlyContinue; Write-Error "GUI did not start"; exit 1 }
          & "$dir\python\python.exe" -c "from PIL import ImageGrab; ImageGrab.grab().save(r'C:\تجربة ريلز\عينة\gui.png')"
          if (Test-Path "$dir\error.log") { Get-Content "$dir\error.log"; exit 1 }
          Stop-Process -Name pythonw -Force
      - name: START.bat — auto tab runs analyse → sections → review → reel
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          $dir = "C:\تجربة ريلز\ReelMaker"
          $g = "C:\تجربة ريلز\واجهة أوتو"
          & "$dir\python\python.exe" "$dir\app\selftest_auto.py" $g --gui-only
          if ($LASTEXITCODE) { exit 1 }
          $argline = "/c `"`"$dir\START.bat`" --autotest-auto `"$g\gui-autotest.json`"`""
          Start-Process -FilePath "cmd.exe" -ArgumentList $argline -WorkingDirectory $dir
          $t = 0
          while (-not (Test-Path "$g\gui-report.json") -and $t -lt 300) { Start-Sleep -Seconds 3; $t += 3 }
          if (Test-Path "$dir\error.log") { Get-Content "$dir\error.log" }
          if (-not (Test-Path "$g\gui-report.json")) { Write-Error "GUI auto run did not finish"; exit 1 }
          $rep = Get-Content "$g\gui-report.json" -Raw -Encoding UTF8 | ConvertFrom-Json
          $rep | ConvertTo-Json
          if (-not $rep.ok) { exit 1 }
          if (-not (Test-Path -LiteralPath $rep.reels[0])) { Write-Error "reel missing"; exit 1 }
      - name: Collect results
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force results | Out-Null
          Copy-Item "C:\تجربة ريلز\عينة\*.png" results -ErrorAction SilentlyContinue
          Copy-Item "C:\تجربة ريلز\عينة\output\*" results -ErrorAction SilentlyContinue
          Copy-Item "C:\تجربة ريلز\واجهة أوتو\shots\*.png" results -ErrorAction SilentlyContinue
          Get-ChildItem -LiteralPath "C:\تجربة ريلز\عينة أوتو\output" -Recurse -File -ErrorAction SilentlyContinue | Copy-Item -Destination results
          Copy-Item "C:\تجربة ريلز\واجهة سينمائي\*.png" results -ErrorAction SilentlyContinue
          Get-ChildItem -LiteralPath "C:\تجربة ريلز\عينة باكات" -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in ".png", ".mp4" } | Copy-Item -Destination results
          Get-ChildItem -LiteralPath "C:\تجربة ريلز\عينة سينمائي\frames" -File -ErrorAction SilentlyContinue | Copy-Item -Destination results
          Get-ChildItem -LiteralPath "C:\تجربة ريلز\عينة سينمائي" -Recurse -File -Filter *.words.json -ErrorAction SilentlyContinue | Copy-Item -Destination results
          Get-ChildItem -LiteralPath "C:\تجربة ريلز\ReelMaker\output" -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in ".mp4", ".jpg" } | Copy-Item -Destination results
          Compress-Archive -Path results\* -DestinationPath selftest-results.zip -Force
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-results
          path: selftest-results.zip

  release:
    needs: [build, test-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=reel-maker
          gh release delete "$tag" -y --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          # tag on main: the token may not tag a commit that changes workflow files;
          # the zip itself is built from this run's commit ($GITHUB_SHA)
          gh release create "$tag" -R "$GITHUB_REPOSITORY" --target main \
            --title "Reel Maker v3.1 (Windows)" --prerelease \
            --notes "v3.1 — جديد: 8 باكات ستايل للكلام (فونت + فونت دهبي + أنيميشن)، 13 فونت عربي، 9 أنيميشن للكلمات، وتخصيص واحفظ كباك — في التابات التلاتة. v3.0: تاب «سينمائي - Cinematic» (لقطات غُنا + ماستر + كلمات ← ريلز متقطّعة بـ 4 ستايلات، كاريوكي، ونسخة إنستجرام/فيسبوك). أول مرة البرنامج بينزّل موديل توقيت الكلمات (~340 ميجا). حمّل ReelMaker-windows.zip، فكّه، ودوس START.bat. أول مرة في الأوتوماتيك البرنامج بينزّل موديل السمع (~500 ميجا) — محتاج نت مرة واحدة. التفاصيل في README.md جوه الفولدر." \
            ReelMaker-windows/ReelMaker-windows.zip selftest-results/selftest-results.zip
