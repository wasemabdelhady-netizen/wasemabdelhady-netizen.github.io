name: ChorusCutter (Windows bundle)

on:
  push:
    paths:
      - "chorus-cutter/**"
      - ".github/workflows/chorus-cutter.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq msitools
      - run: python3 chorus-cutter/build/build_bundle.py dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: ChorusCutter-windows
          path: dist/ChorusCutter-windows.zip
          retention-days: 14

  test-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ChorusCutter-windows
      - name: Unzip into an Arabic path
        shell: pwsh
        run: |
          $root = "C:\تجربة كورس"
          New-Item -ItemType Directory -Force $root | Out-Null
          Expand-Archive ChorusCutter-windows.zip -DestinationPath $root
          Get-ChildItem "$root\ChorusCutter"
      - name: Python, tkinter, numpy
        shell: pwsh
        run: |
          $py = "C:\تجربة كورس\ChorusCutter\python\python.exe"
          & $py -c "import sys, tkinter, winsound, numpy; print(sys.version); print('tk', tkinter.TkVersion, 'numpy', numpy.__version__)"
          if ($LASTEXITCODE) { exit 1 }
      - name: Analysis + export on a sample song (Arabic file names)
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          $py = "C:\تجربة كورس\ChorusCutter\python\python.exe"
          & $py "C:\تجربة كورس\ChorusCutter\app\selftest.py" "C:\تجربة كورس\عينة"
          if ($LASTEXITCODE) { exit 1 }
      - name: START.bat — GUI finds, plays, nudges and exports
        shell: pwsh
        run: |
          $dir = "C:\تجربة كورس\ChorusCutter"
          $s = "C:\تجربة كورس\عينة"
          $report = "$s\gui-report.json"
          $argline = "/c `"`"$dir\START.bat`" --autotest `"$s\أغنية تجربة - master.wav`" `"$report`" `"$s\أغنية تجربة - vocals.wav`"`""
          Start-Process -FilePath "cmd.exe" -ArgumentList $argline -WorkingDirectory $dir
          $t = 0
          while (-not (Test-Path $report) -and $t -lt 120) { Start-Sleep -Seconds 2; $t += 2 }
          Start-Sleep -Seconds 2
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$s\gui.png")
          Stop-Process -Name pythonw -Force -ErrorAction SilentlyContinue
          if (Test-Path "$dir\error.log") { Get-Content "$dir\error.log" -Encoding utf8; exit 1 }
          if (-not (Test-Path $report)) { Write-Error "GUI produced no report"; exit 1 }
          $r = Get-Content $report -Encoding utf8 -Raw | ConvertFrom-Json
          $r | ConvertTo-Json -Depth 4
          if ($r.error) { exit 1 }
          if ($r.files.Count -ne 4) { Write-Error "expected 4 exported files"; exit 1 }
          if ([math]::Abs($r.start - $r.typed) -gt 0.01) { Write-Error "typed start not applied"; exit 1 }
          if ($r.song -ne "أغنية تجربة") { Write-Error "song name not cleaned"; exit 1 }
          if (-not $r.cands[0][3]) { Write-Error "best clip does not start on a sung word"; exit 1 }
          foreach ($f in $r.files) { if (-not (Test-Path $f)) { Write-Error "missing $f"; exit 1 } }
          Get-ChildItem "$dir\output"
      - name: Collect results
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force results | Out-Null
          Copy-Item "C:\تجربة كورس\عينة\gui.png", "C:\تجربة كورس\عينة\gui-report.json" results -ErrorAction SilentlyContinue
          Copy-Item "C:\تجربة كورس\ChorusCutter\output\*.mp3" results -ErrorAction SilentlyContinue
          Compress-Archive -Path results\* -DestinationPath selftest-results.zip -Force
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-results
          path: selftest-results.zip

  release:
    needs: [build, test-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=chorus-cutter
          ver=$(grep -oP '^VERSION = "\K[^"]+' chorus-cutter/app/engine.py)
          gh release delete "$tag" -y --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create "$tag" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "ChorusCutter v$ver (Windows)" --prerelease \
            --notes "حمّل ChorusCutter-windows.zip، فكّه، ودوس START.bat. التفاصيل في README.md جوه الفولدر." \
            ChorusCutter-windows/ChorusCutter-windows.zip selftest-results/selftest-results.zip
