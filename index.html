<style>
  :root {
    --bg:#0a0a0a;
    --gold:#e0a458;
    --text:#f5efe6;
    --muted:rgba(245,239,230,.62);
    --en:'Syne',system-ui,sans-serif;
    --ar-display:'Reem Kufi','Cairo',sans-serif;
    --ar:'Cairo',system-ui,sans-serif;
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { scroll-behavior:smooth; }
  body {
    font-family:var(--ar);
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  img { display:block; max-width:100%; }

  /* ---------- HERO (mobile-first) ---------- */
  .hero {
    position:relative;
    min-height:100vh;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    overflow:hidden;
    isolation:isolate;
  }
  .hero__media {
    position:absolute; inset:0; z-index:-1;
  }
  .hero__media img {
    width:100%; height:100%;
    object-fit:cover;
    object-position:50% 15%;
  }
  .hero__media::after {
    content:""; position:absolute; inset:0;
    background:linear-gradient(to top,
      var(--bg) 0%,
      rgba(10,10,10,.94) 26%,
      rgba(10,10,10,.6) 42%,
      rgba(10,10,10,0) 62%);
  }

  .hero__content {
    direction:ltr;
    text-align:center;
    padding:0 20px calc(44px + env(safe-area-inset-bottom));
    animation:fadeIn 1.1s ease-out both;
  }

  .hero__name {
    font-family:var(--en);
    font-weight:800;
    text-transform:uppercase;
    line-height:.92;
    letter-spacing:-.01em;
    /* "ABDELHADY" in Syne 800 ≈ 10.4em wide — size it to fill the column */
    font-size:calc((100vw - 40px) / 10.5);
  }
  .hero__name span { display:block; }

  .hero__ar {
    margin-top:14px;
    font-family:var(--ar-display);
    font-weight:500;
    color:var(--gold);
    font-size:clamp(22px, 6.4vw, 38px);
    line-height:1.3;
  }

  .hero__role {
    margin-top:10px;
    font-family:var(--en);
    font-weight:700;
    font-size:clamp(11px, 3vw, 14px);
    letter-spacing:.42em;
    color:var(--muted);
    padding-left:.42em; /* balance trailing letter-spacing when centered */
  }

  .hero__cta {
    margin-top:28px;
    display:flex; gap:12px; justify-content:center;
  }
  .btn {
    display:inline-flex; align-items:center; justify-content:center;
    min-width:140px; height:50px; padding:0 26px;
    border-radius:999px;
    font-family:var(--ar); font-weight:700; font-size:16px;
    text-decoration:none;
    transition:transform .2s ease, background .2s ease, color .2s ease, box-shadow .2s ease;
  }
  .btn--solid { background:var(--gold); color:var(--bg); box-shadow:0 10px 30px rgba(224,164,88,.25); }
  .btn--line  { border:1.5px solid var(--gold); color:var(--gold); }
  .btn:hover { transform:translateY(-2px); }
  .btn--line:hover { background:rgba(224,164,88,.1); }
  .btn:focus-visible { outline:2px solid var(--text); outline-offset:3px; }

  @keyframes fadeIn {
    from { opacity:0; transform:translateY(12px); }
    to   { opacity:1; transform:none; }
  }

  /* ---------- HERO (desktop) ---------- */
  @media (min-width:900px) {
    .hero {
      flex-direction:row;
      align-items:center;
      justify-content:flex-end;
      direction:ltr;
    }
    .hero__media { inset:0 auto 0 0; width:55%; }
    .hero__media::after {
      background:
        linear-gradient(to right, rgba(10,10,10,0) 55%, var(--bg) 100%),
        linear-gradient(to top, var(--bg) 0%, rgba(10,10,10,0) 30%);
    }
    .hero__content {
      width:52%;
      text-align:left;
      padding:0 5vw 0 0;
    }
    .hero__name { font-size:min(calc(47vw / 10.5), 120px); }
    .hero__ar { font-size:clamp(28px, 2.6vw, 40px); }
    .hero__role { padding-left:0; }
    .hero__cta { justify-content:flex-start; }
  }

  @media (prefers-reduced-motion:reduce) {
    html { scroll-behavior:auto; }
    .hero__content { animation:none; }
  }
